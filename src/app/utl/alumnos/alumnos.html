<div class="card p-4">
  <div class="card-head">
    <!-- Botón Agregar Arriba -->
    <div class="mb-4">
      <button
        type="button"
        [routerLink]="['/utl/agregar']"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 focus:outline-none"
      >
        Agregar
      </button>
    </div>

    <div class="card-body">
      <!-- Sección de Filtrado -->
      <div class="mb-3">
        <label class="block mb-2 text-sm font-medium text-gray-900">Filtrar por:</label>
        <input
          [(ngModel)]="listFilter"
          type="text"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder=""
        />
      </div>

      <div class="mb-3">
        <h3 class="text-sm font-medium text-gray-700">Filtro: {{ listFilter }}</h3>
      </div>

      <!-- Tabla de Alumnos -->
      <div class="overflow-x-auto shadow-sm sm:rounded-lg">
        <table class="w-full text-sm text-left text-gray-500" *ngIf="alumnosIric && alumnosIric.length > 0">
          <thead class="text-xs uppercase bg-gray-700 text-white">
            <tr>
              <th scope="col" class="px-6 py-3">MATRÍCULA</th>
              <th scope="col" class="px-6 py-3">NOMBRE</th>
              <th scope="col" class="px-6 py-3">APATERNO</th>
              <th scope="col" class="px-6 py-3">AMATERNO</th>
              <th scope="col" class="px-6 py-3">CORREO</th>
              <th scope="col" class="px-6 py-3">EDITAR</th>
              <th scope="col" class="px-6 py-3">ELIMINAR</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let alumno of alumnosIric | alumnoFilter: listFilter" class="bg-white border-b hover:bg-gray-50">
              <td class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap">{{ alumno.matricula }}</td>
              <td class="px-6 py-4">{{ alumno.nombre }}</td>
              <td class="px-6 py-4">{{ alumno.apaterno }}</td>
              <td class="px-6 py-4">{{ alumno.amaterno }}</td>
              <td class="px-6 py-4">{{ alumno.correo }}</td>
              
              <!-- Botón Editar con routerLink funcional -->
              <td class="px-6 py-4">
                <button
                  [routerLink]="['/utl/editar', alumno.matricula]"
                  class="text-white bg-teal-600 hover:bg-teal-700 focus:ring-4 focus:ring-teal-300 font-medium rounded-lg text-xs px-3.5 py-2 inline-flex items-center focus:outline-none"
                >
                  Editar
                </button>
              </td>

              <!-- Botón Eliminar conectado a la función TypeScript -->
              <td class="px-6 py-4">
                <button
                  (click)="eliminarAlumno(alumno.matricula)"
                  class="text-white bg-red-600 hover:bg-red-700 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-xs px-3.5 py-2 inline-flex items-center focus:outline-none"
                >
                  Eliminar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
