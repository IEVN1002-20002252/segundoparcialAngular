<div class="max-w-xl mx-auto my-8 p-6 bg-white rounded-xl shadow-md">
  <h2 class="text-2xl font-bold mb-6 text-gray-800">Registrar Alumno</h2>

  <!-- Formulario en disposición vertical -->
  <form (ngSubmit)="agregarAlumno()" class="flex flex-col gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700">Matrícula</label>
      <input
        type="text"
        [(ngModel)]="nuevoAlumno.matricula"
        name="matricula"
        required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Nombre Completo</label>
      <input
        type="text"
        [(ngModel)]="nuevoAlumno.nombre"
        name="nombre"
        required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Correo Electrónico</label>
      <input
        type="email"
        [(ngModel)]="nuevoAlumno.correo"
        name="correo"
        required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Materia</label>
      <input
        type="text"
        [(ngModel)]="nuevoAlumno.materia"
        name="materia"
        required
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"
      />
    </div>

    <!-- Botón al final -->
    <div class="pt-2">
      <button
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md shadow transition-colors"
      >
        Agregar Alumno
      </button>
    </div>
  </form>
</div>
