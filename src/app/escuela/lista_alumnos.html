<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
  <form [formGroup]="formulario" (ngSubmit)="agregarAlumno()">
    <!-- Matrícula -->
    <div class="mb-5">
      <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">Matrícula</label>
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      />
    </div>

    <!-- Nombre -->
    <div class="mb-5">
      <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
      />
    </div>

    <!-- Correo -->
    <div class="mb-5">
      <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">Correo</label>
      <input
        type="email"
        id="correo"
        name="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      />
    </div>

    <!-- Materia -->
    <div class="mb-5">
      <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">Materia</label>
      <input
        type="text"
        id="materia"
        name="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      />
    </div>

    <!-- Botón -->
    <div class="flex justify-center mt-5">
      <button
        type="submit"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm w-full sm:w-auto px-5 py-2.5 text-center"
      >
        Agregar Alumno
      </button>
    </div>
  </form>

  <!-- Muestra de datos interpolados -->
  <div class="mt-6">
    <h1>Lista Alumno</h1>
    <h2>Matricula: {{nuevoAlumno.matricula}}</h2>
    <h2>Nombre: {{nuevoAlumno.nombre}}</h2>
    <h2>Correo: {{nuevoAlumno.correo}}</h2>
    <h2>Materia: {{nuevoAlumno.materia}}</h2>
  </div>
</div>
