<div class="max-w-4xl mx-auto p-6 bg-white rounded-lg shadow my-6">
  <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Registro de Alumnos</h2>

  <form [formGroup]="formulario" (ngSubmit)="agregarAlumno()" class="mb-8">
    
    <!-- Contenedor vertical (sin grid de dos columnas) -->
    <div class="space-y-4">
      
      <!-- Matrícula -->
      <div>
        <label for="matricula" class="block mb-2 text-sm font-medium text-gray-900">Matrícula</label>
        <input
          type="text"
          id="matricula"
          formControlName="matricula"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="Matrícula"
        />
      </div>

      <!-- Nombre -->
      <div>
        <label for="nombre" class="block mb-2 text-sm font-medium text-gray-900">Nombre</label>
        <input
          type="text"
          id="nombre"
          formControlName="nombre"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="Nombre"
        />
      </div>

      <!-- Correo -->
      <div>
        <label for="correo" class="block mb-2 text-sm font-medium text-gray-900">Correo</label>
        <input
          type="email"
          id="correo"
          formControlName="correo"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="Correo"
        />
      </div>

      <!-- Materia -->
      <div>
        <label for="materia" class="block mb-2 text-sm font-medium text-gray-900">Materia</label>
        <input
          type="text"
          id="materia"
          formControlName="materia"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
          placeholder="Materia"
        />
      </div>

    </div>

    <!-- Botón de guardar/agregar -->
    <div class="flex justify-center mt-6">
      <button
        type="submit"
        class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-6 py-2.5 text-center cursor-pointer"
      >
        {{ indiceEdicion === -1 ? 'Agregar Alumno' : 'Actualizar Alumno' }}
      </button>
    </div>
  </form>

  <!-- Tabla para mostrar la lista de alumnos registrados -->
  <div class="overflow-x-auto">
    <h3 class="text-xl font-bold mb-4 text-gray-800">Lista de Alumnos Registrados</h3>
    
    <table class="w-full text-sm text-left text-gray-500 border border-gray-200 rounded-lg">
      <thead class="text-xs text-gray-700 uppercase bg-gray-100">
        <tr>
          <th scope="col" class="px-6 py-3">Matrícula</th>
          <th scope="col" class="px-6 py-3">Nombre</th>
          <th scope="col" class="px-6 py-3">Correo</th>
          <th scope="col" class="px-6 py-3">Materia</th>
          <th scope="col" class="px-6 py-3 text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of alumnos; let i = index" class="bg-white border-b hover:bg-gray-50">
          <td class="px-6 py-4 font-medium text-gray-900">{{ alumno.matricula }}</td>
          <td class="px-6 py-4">{{ alumno.nombre }}</td>
          <td class="px-6 py-4">{{ alumno.correo }}</td>
          <td class="px-6 py-4">{{ alumno.materia }}</td>
          <td class="px-6 py-4 text-center flex justify-center gap-2">
            <!-- Botón Editar -->
            <button 
              type="button" 
              (click)="editarAlumnos(i)" 
              class="font-medium text-white bg-yellow-500 hover:bg-yellow-600 px-3 py-1.5 rounded cursor-pointer"
            >
              Editar
            </button>
            <!-- Botón Eliminar -->
            <button 
              type="button" 
              (click)="eliminarAlumno(i)" 
              class="font-medium text-white bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded cursor-pointer"
            >
              Eliminar
            </button>
          </td>
        </tr>
        <!-- Mensaje si no hay alumnos -->
        <tr *ngIf="alumnos.length === 0">
          <td colspan="5" class="px-6 py-4 text-center text-gray-500">No hay alumnos registrados todavía.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
