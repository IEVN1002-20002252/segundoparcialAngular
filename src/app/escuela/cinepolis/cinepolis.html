<div class="max-w-4xl mx-auto my-6 p-6 bg-blue-900 text-white rounded-lg shadow-xl border-2 border-blue-700">
  <div class="text-center mb-6">
    <h1 class="text-4xl font-extrabold italic tracking-wider text-yellow-400">Cinépolis BRAULIO</h1>
    <p class="text-sm tracking-widest text-blue-200">LA CAPITAL CINE BRAULIO</p>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="procesar()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      
      <!-- Sección Entradas -->
      <div class="border-2 border-blue-400 p-4 rounded-md bg-blue-800 bg-opacity-50">
        <h2 class="text-xl font-bold mb-4 border-b border-blue-400 pb-1 italic">Entradas</h2>
        
        <div class="mb-4">
          <label for="nombre" class="block text-sm font-medium mb-1">Nombre</label>
          <input
            type="text"
            id="nombre"
            formControlName="nombre"
            class="w-full p-2 rounded text-black font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-400"
            required
          />
        </div>

        <div class="mb-4">
          <label for="compradores" class="block text-sm font-medium mb-1">Cantidad Compradores</label>
          <input
            type="number"
            id="compradores"
            formControlName="compradores"
            min="1"
            class="w-full p-2 rounded text-black font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-400"
            required
          />
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium mb-1">Tarjeta Cineco</label>
          <div class="flex items-center space-x-6 mt-1">
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" formControlName="tarjetaCineco" value="si" class="form-radio text-yellow-400 w-5 h-5 cursor-pointer" />
              <span class="ml-2 font-bold">Sí</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" formControlName="tarjetaCineco" value="no" class="form-radio text-yellow-400 w-5 h-5 cursor-pointer" />
              <span class="ml-2 font-bold">No</span>
            </label>
          </div>
        </div>

        <div class="mb-2">
          <label for="boletas" class="block text-sm font-medium mb-1">Cantidad De Boletas</label>
          <input
            type="number"
            id="boletas"
            formControlName="boletas"
            min="1"
            class="w-full p-2 rounded text-black font-semibold focus:outline-none focus:ring-2 focus:ring-yellow-400"
            required
          />
        </div>
      </div>

      <!-- Sección Salidas -->
      <div class="border-2 border-blue-400 p-4 rounded-md bg-blue-800 bg-opacity-50 flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold mb-4 border-b border-blue-400 pb-1 italic">Salidas</h2>
          <div class="mt-4">
            <label class="block text-sm font-medium mb-1">Valor a Pagar</label>
            <div class="w-full p-3 bg-white text-black text-2xl font-bold rounded min-h-[48px] flex items-center justify-end">
              {{ totalPagar | currency }}
            </div>
          </div>
          
          <div *ngIf="procesado" class="mt-4 p-3 bg-blue-900 border border-blue-400 rounded">
            <p class="text-sm"><span class="font-bold text-yellow-300">Comprador:</span> {{ nombreCliente }}</p>
          </div>
        </div>

        <!-- Mensaje de error de validación -->
        <div *ngIf="mensajeError" class="mt-4 p-3 bg-red-600 text-white rounded text-sm font-bold">
          {{ mensajeError }}
        </div>
      </div>

    </div>

    <!-- Sección Acciones -->
    <div class="border-2 border-blue-400 p-4 rounded-md bg-blue-800 bg-opacity-50 text-center">
      <h2 class="text-lg font-bold mb-3 italic">Acciones</h2>
      <div class="flex justify-center space-x-6">
        <button
          type="submit"
          class="bg-yellow-400 hover:bg-yellow-500 text-blue-950 font-bold py-2 px-8 rounded shadow transition-colors cursor-pointer"
        >
          Procesar
        </button>
        <!-- Botón Ver Registro actualizado correctamente -->
        <button
          type="button"
          (click)="verRegistro()"
          class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-8 rounded shadow transition-colors cursor-pointer"
        >
          Ver Registro
        </button>
      </div>
    </div>

  </form>
</div>
